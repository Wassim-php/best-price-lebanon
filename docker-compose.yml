services:
  # 1. The Django Website
  web:
    build: .
    # '0.0.0.0' allows external access (required for Docker)
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    shm_size: 2gb
    depends_on:
      - db
      - redis
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev-only-change-me}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - POSTGRES_NAME=${POSTGRES_NAME:-lebanon_prices}
      - POSTGRES_USER=${POSTGRES_USER:-awfarlak}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-123StrongPass@}
      - POSTGRES_HOST=db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - ISHTARI_API_TOKEN=${ISHTARI_API_TOKEN:-}

  # 2. The Database (Postgres)
  db:
    image: postgres:15
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_NAME:-lebanon_prices}
      - POSTGRES_USER=${POSTGRES_USER:-awfarlak}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-123StrongPass@}
    # Maps internal port 5432 to external 5433
    # This PREVENTS CONFLICTS with your other Postgres container
    ports:
      - "5433:5432"

  # 3. Redis (Required for Celery Task Queue)
  redis:
    image: redis:alpine

  # 4. Celery Worker (For Web Scraping)
  celery:
    build: .
    # IMPORTANT: Replace 'core' with your actual project name (the folder containing settings.py)
    command: celery -A best_price_lebanon worker --loglevel=info
    volumes:
      - .:/app
    shm_size: 2gb
    depends_on:
      - web
      - redis
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev-only-change-me}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - POSTGRES_NAME=${POSTGRES_NAME:-lebanon_prices}
      - POSTGRES_USER=${POSTGRES_USER:-awfarlak}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-awfarlak_dev_password}
      - POSTGRES_HOST=db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - ISHTARI_API_TOKEN=${ISHTARI_API_TOKEN:-}
volumes:
  postgres_data:
